@if (img !== '') {
  <article class="relative card-poster--ui group">
    <div
      class="rounded-xl overflow-hidden shadow-md transition-all relative cursor-pointer max-w-52 min-w-40 aspect-[2/3] group-hover:-translate-y-4 hover:min-w-[12.5rem]"
      style="width: 210px; height: 300px; will-change: transform"
    >
      @if (!loadedPoster()) {
        <div
          class="absolute inset-0 animate-pulse bg-[var(--gray-100-opacity-36)]"
          aria-hidden="true"
        ></div>
      }

      @if (isPriority) {
        <!-- Imágenes prioritarias -->
        <img
          class="object-cover object-center group-hover:bg-red-950 group-hover:contrast-100 group-hover:scale-105 cursor-pointer transition-all ease-in-out duration-300 aspect-[2/3] w-full h-full"
          [ngSrc]="img"
          decoding="sync"
          [alt]="title + ' - Póster de la película'"
          width="780"
          height="1170"
          priority
          [@blurFade]="loadedPoster() ? 'loaded' : 'loading'"
          (load)="loadedPoster.set(true)"
          [style.view-transition-name]="'card-poster-' + viewTransitionId"
          itemprop="image"
        />
      } @else {
        <!-- Imágenes con lazy loading -->
        <img
          class="object-cover object-center group-hover:bg-red-950 group-hover:contrast-100 group-hover:scale-105 cursor-pointer transition-all ease-in-out duration-300 aspect-[2/3] w-full h-full"
          [ngSrc]="img"
          decoding="async"
          [alt]="title + ' - Póster de la película'"
          width="780"
          height="1170"
          loading="lazy"
          [@blurFade]="loadedPoster() ? 'loaded' : 'loading'"
          (load)="loadedPoster.set(true)"
          [style.view-transition-name]="'card-poster-' + viewTransitionId"
          itemprop="image"
        />
      }

      <div
        class="absolute inset-x-0 bottom-0 flex flex-col w-full gap-3 left-0 px-4 py-2 group-hover:p-4 rounded-t-xl bg-[rgba(0,0,0,0.50)] group-hover:bg-[rgba(0,0,0,0.80)] z-10"
      >
        <p
          class="hidden group-hover:[display:-webkit-box] overflow-hidden [-webkit-box-orient:vertical] [-webkit-line-clamp:2] text-white/60"
        >
          {{ description }}
        </p>
        <span class="text-primary-ui space-x-6 font-body"> ⭐ {{ vote | number: '1.1-1' }} </span>
      </div>
    </div>

    <h2
      class="text-accent-ui text-base text-center font-bodyTwo [display:-webkit-box] [-webkit-box-orient:vertical] [-webkit-line-clamp:1] overflow-hidden"
      style="min-height: 2.5rem; line-height: 1.25rem"
      itemprop="name"
    >
      {{ title }}
    </h2>
  </article>
}
